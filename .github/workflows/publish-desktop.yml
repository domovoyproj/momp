name: Publish desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-desktop:
    name: Build and publish desktop bundles
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # app target only: the dmg styling step (AppleScript/Finder)
            # hangs on headless CI runners; the updater uses the .app.tar.gz
            args: "--bundles app --target universal-apple-darwin"
            fetch: "darwin-aarch64 darwin-x64"
          - platform: windows-latest
            args: "--bundles nsis"
            fetch: "windows-x64"
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch bun binaries for the desktop app
        run: bun run desktop:fetch-bun -- ${{ matrix.fetch }}

      - name: Sync desktop versions with package.json
        run: bun run desktop:sync-version

      - name: Build and stage the server payload
        run: bun scripts/stage-desktop.mjs --universal

      - name: Install Rust targets for the universal macOS build
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build bundles and publish GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "omp-desktop v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          includeUpdaterJson: false
          tauriScript: "bun run tauri"
          args: ${{ matrix.args }}

  finalize-updater-json:
    name: Build and upload latest.json
    needs: publish-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          bun scripts/build-updater-json.mjs "$TAG"
