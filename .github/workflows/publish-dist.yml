name: Publish dist release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the dist asset to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach prebuilt dist
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.3.14 (bin/runtime.js MIN_BUN_VERSION): the
          # omp SDK ships TypeScript importing `bun:` builtins.
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Pack prebuilt dist
        run: >-
          tar --exclude='.next/cache' --exclude='.next/dev'
          -czf momp-web-dist.tar.gz
          .next public bin next.config.js package.json bun.lock
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: momp-web-dist.tar.gz

  desktop:
    name: Build and attach momp.exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # Bun's default cache lives under the runner's profile, and the omp SDK
      # globs the home directory during `next build`. On windows runners the
      # profile contains junctions (Application Data, Templates) that raise
      # EPERM, so both the cache and HOME are redirected into the workspace.
      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun-cache
        run: bun install --frozen-lockfile --backend=copyfile
      - name: Fetch embedded Bun runtime
        run: bun run desktop:fetch-bun windows-x64
      - name: Stage server payload
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun-cache
          HOME: ${{ runner.temp }}\home
          USERPROFILE: ${{ runner.temp }}\home
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\home" | Out-Null
          bun scripts/stage-desktop.mjs
      # Rust/cargo keeps the real profile: rustup and the MSVC toolchain of the
      # windows runner live there.
      - name: Build standalone executable
        run: bun scripts/build-desktop.mjs
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: src-tauri/target/release/momp.exe
