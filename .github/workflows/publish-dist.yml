name: Verified release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish-dist.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then exit 1; fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: tar --exclude='.next/cache' --exclude='.next/dev' -czf momp-web-dist.tar.gz .next public bin next.config.js package.json bun.lock
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: momp-web-dist.tar.gz

  desktop:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun-cache
        run: bun install --frozen-lockfile --backend=copyfile
      - run: bun run typecheck
      - run: bun test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: ./scripts/test-update-helper.ps1
      - run: bun run desktop:fetch-bun windows-x64
      - name: Stage server payload
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun-cache
          HOME: ${{ runner.temp }}\home
          USERPROFILE: ${{ runner.temp }}\home
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\home" | Out-Null
          bun scripts/stage-desktop.mjs
      - run: bun scripts/build-desktop.mjs
      - name: Test the actual release executable
        run: ./scripts/smoke-desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-release
          path: src-tauri/target/release/momp.exe

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - run: cd release && sha256sum momp.exe momp-web-dist.tar.gz > SHA256SUMS
      - name: Publish only verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published executables."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/momp.exe release/momp-web-dist.tar.gz release/SHA256SUMS --draft --target "$GITHUB_SHA" --title "momp $RELEASE_TAG" --notes-file docs/release-notes.md
