<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp-desktop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #0d0e11;
        color: #e8e9ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        user-select: none;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: linear-gradient(135deg, #e14d92 0%, #7c4ddb 50%, #3aa7d8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 30px;
        color: #ffffff;
        letter-spacing: -1px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(232, 233, 236, 0.18);
        border-top-color: #8a8f9a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      p {
        font-size: 14px;
        color: #8a8f9a;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">π</div>
      <div class="spinner"></div>
      <p>Avvio di omp-desktop&hellip;</p>
    </div>
  </body>
</html>
