[package]
name = "momp"
version = "1.1.5"
description = "Single standalone executable for momp"
authors = ["domovoyproj"]
edition = "2021"
license = "MIT"
repository = "https://github.com/domovoyproj/momp"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
